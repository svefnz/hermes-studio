services:
  hermes-studio:
    build: .
    container_name: hermes-studio
    restart: unless-stopped
    network_mode: host
    environment:
      - HERMES_WEB_UI_HOME=/data
      - HERMES_WEB_UI_DISABLE_GATEWAY_AUTOSTART=1
      # - PORT=8648
      # - BIND_HOST=0.0.0.0
      # - LOG_LEVEL=info
      # - AUTH_TOKEN=换成长随机串
    volumes:
      - /var/lib/hermes-studio:/data
      - /root/.hermes:/root/.hermes:ro
